[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klpo"
version = "0.1.0"
description = "Critic-free KL-Regularized Policy Optimization"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = ["torch>=2.2"]

[project.urls]
Homepage = "https://yifanzhang-pro.github.io/KLPO/"
Repository = "https://github.com/yifanzhang-pro/KLPO"
Documentation = "https://github.com/yifanzhang-pro/KLPO/blob/main/docs/algorithms.md"
Paper = "https://yifanzhang-pro.github.io/KLPO/KLPO.pdf"
Issues = "https://github.com/yifanzhang-pro/KLPO/issues"

[dependency-groups]
dev = ["numpy", "pytest>=8"]  # numpy only silences a torch import warning

[tool.setuptools.packages.find]
include = ["klpo*"]

[tool.uv.sources]
# CPU wheels for the project environment on Linux; GPU training uses Molt's environment.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
