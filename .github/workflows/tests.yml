name: CPU tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: git submodule update --init --checkout external/labs-molt
      - run: uv sync --locked
      - run: uv run python scripts/check_molt.py
      - run: uv run pytest -q
